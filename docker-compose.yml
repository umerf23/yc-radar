services:
  yc-radar:
    build: .
    image: yc-radar:latest
    container_name: yc-radar
    restart: unless-stopped

    env_file:
      - .env

    environment:
      YC_RADAR_DB_PATH: /data/yc_radar.db
      TZ: America/Los_Angeles

    volumes:
      - yc-radar-data:/data
      - ./config.yaml:/app/config.yaml:ro

    ports:
      - "127.0.0.1:8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  yc-radar-data:
